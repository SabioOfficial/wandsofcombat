name: Compile all versions

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          versions=$(ls -d versions/*/ | xargs -n1 basename | jq -R . | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Versions: $versions"

compile:
  needs: list-versions
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix:
      version: ${{ fromJson(needs.list-versions.outputs.versions) }}
  name: compile ${{ matrix.version }}
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

    - uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Compile Java for ${{ matrix.version }}
      run: ./gradlew ":${{ matrix.version }}:compileJava" --stacktrace
